name: Build and test launcher
on:
  pull_request:
  push:
    branches: [main, '1.1.0']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build and isolated regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build DestinyLauncher/DestinyLauncher.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($project in @('MemorySmoke','InstallationSmoke','MinecraftSmoke','PackUpdaterSmoke','NewsFeedSmoke','DiscordLinkSmoke')) {
            dotnet run --project "tools/$project/$project.csproj" -c Release -- "artifacts/ci/$project"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          dotnet run --project tools/MinecraftSmoke -c Release -p:SisuExperiment=true -- --microsoft-only artifacts/ci/microsoft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UiSmoke -c Release -p:SisuExperiment=true -- artifacts/ci/microsoft-ui --microsoft-ui-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UiSmoke -c Release -p:SisuExperiment=true -- artifacts/ci/accounts-ui --accounts-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UiSmoke/UiSmoke.csproj -c Release -- artifacts/ci/ui --headless
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/UiSmoke/UiSmoke.csproj -c Release -- artifacts/ci/update-ui --update-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/PackUpdaterSmoke/PackUpdaterSmoke.csproj -c Release -- --floating-only artifacts/ci/floating-mods
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/Test-PackVariants.ps1 -OutputDirectory artifacts/ci/variants
          dotnet run --project tools/UiSmoke/UiSmoke.csproj -c Release -- artifacts/ci/discord-ui --discord-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publish installer experiment
        if: github.ref != 'refs/heads/1.1.0'
        shell: pwsh
        run: |
          ./tools/Ensure-InnoSetup.ps1 | Out-Null
          ./tools/Publish-Launcher.ps1 -OutputPath "$pwd/artifacts/ci/payload"
          ./tools/Build-Installer.ps1 -PublishPath "$pwd/artifacts/ci/payload" -OutputPath "$pwd/artifacts/ci/installers" -Offline -Experimental -DataRoot 'C:\DestinyLauncherTestData'
          ./tools/Build-Installer.ps1 -PublishPath "$pwd/artifacts/ci/payload" -OutputPath "$pwd/artifacts/ci/installers" -Experimental -DataRoot 'C:\DestinyLauncherTestData'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref != 'refs/heads/1.1.0'
        with:
          name: unsigned-installer-experiment
          path: artifacts/ci/installers/*.exe
          retention-days: 14
  linux-core:
    # WPF is Windows-only. These checks validate shared backend code, not a Linux UI.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Shared memory and modpack behavior on Linux
        run: |
          dotnet run --project tools/MemorySmoke -c Release
          dotnet run --project tools/PackUpdaterSmoke -c Release -- artifacts/ci/linux-packs
